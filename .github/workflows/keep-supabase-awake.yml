name: 保持雪梨后端活跃
#
# 免费版 Supabase 项目“一周内数据库活跃度不足”会被自动暂停。
# 这个定时任务每天访问一次接口，让项目保持活跃；失败时本次运行会标记为失败，
# GitHub 会给仓库所有者发通知邮件，相当于多一层“项目出问题了”的提醒。
#
# 注意：GitHub 会在仓库连续 60 天没有任何提交后停掉定时任务，需要偶尔留意。

on:
  schedule:
    # 每天 09:23（北京时间）执行一次
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 访问 Supabase 接口，刷新项目活跃度
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::缺少 VITE_SUPABASE_URL 或 VITE_SUPABASE_ANON_KEY 仓库密钥"
            exit 1
          fi

          if ! status="$(curl -sS --max-time 30 -o /tmp/body.txt -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")"; then
            echo "::error::无法连接后端，项目可能已被暂停，请到 Supabase Dashboard 检查并 Resume project"
            exit 1
          fi

          echo "接口返回 HTTP ${status}"
          cat /tmp/body.txt
          echo

          # 401 / 403 表示匿名密钥被行级权限规则挡住，属于正常结果；
          # 只要接口能应答，就说明后端在运行，这次访问已经算作项目活跃。
          case "${status}" in
            200|401|403)
              echo "后端正常响应，活跃度已刷新"
              ;;
            *)
              echo "::error::后端异常（HTTP ${status}），可能已被暂停，请到 Supabase Dashboard 检查并 Resume project"
              exit 1
              ;;
          esac
