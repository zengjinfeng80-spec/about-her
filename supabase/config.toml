project_id = "about-her"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://zengjinfeng80-spec.github.io/about-her/"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173", "http://localhost:4173", "https://zengjinfeng80-spec.github.io/about-her/"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(SMTP_PASS)"
admin_email = "about-her@mail.kittydesk.com"
sender_name = "雪梨"

[auth.email.template.magic_link]
subject = "你的“雪梨”登录验证码"
content_path = "./supabase/templates/magic-link.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.analyze-entry]
verify_jwt = true

[functions.ask-memory]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
